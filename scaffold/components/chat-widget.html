<!--
Chat widget snippet — opt-in, not included by default. Example only:
no chat provider is bundled or endorsed by garp. If you add an AI chat
widget (Chatbase, Crisp, Intercom, Tawk.to, etc.), it's a separate system
that garp doesn't generate or manage — see HANDOFF.md's External
integrations section.

To use on a page:
  1. Sign up with a chat provider and copy the embed snippet from their
     dashboard — it's almost always a single <script> tag like the one
     below, setting an ID and loading their JS from their own CDN.
  2. In config.yaml, add:
       chat:
         embed_id: your-provider-widget-id
  3. Replace the placeholder script src below with your provider's actual
     embed URL, then include this component near the closing </body> tag
     (e.g. in layouts/base.html, alongside the analytics.html include).

Every provider's dashboard has zero-code setup instructions — this file
just documents where that snippet goes in a garp project.
-->
{% if site.chat.embed_id %}
<script>
	window.chatWidgetId = "{{ site.chat.embed_id }}";
</script>
<script async src="https://widget.your-chat-provider.example/embed.js"></script>
{% endif %}
