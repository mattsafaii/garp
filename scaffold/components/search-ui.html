<!--
Pagefind search UI — opt-in, not included by default. Requires the
pagefind CLI (https://pagefind.app) at authoring time; garp itself never
depends on it, and the CI build never runs it.

To use on a page:
  1. Run `garp build` (produces the output pagefind needs to crawl).
  2. Run `garp search` — indexes the built site with pagefind and writes
     the result straight to static/pagefind/. Commit that directory so a
     plain `garp build` reproduces it on every future build/deploy
     without pagefind being installed.
  3. Include this component where the search UI should render. Its CSS
     and JS ship inside static/pagefind/, generated by step 2 — this
     file just wires up pagefind's own prebuilt PagefindUI widget.
-->
<link href="/pagefind/pagefind-ui.css" rel="stylesheet">
<script src="/pagefind/pagefind-ui.js"></script>

<div id="search"></div>
<script>
	window.addEventListener("DOMContentLoaded", function () {
		new PagefindUI({ element: "#search" });
	});
</script>
